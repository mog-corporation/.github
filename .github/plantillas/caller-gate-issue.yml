name: gate issue form

# CALLER FINO: no lleva logica, ni vocabulario, ni scripts. La puerta es una sola y vive en
# mog-corporation/.github (workflow reutilizable `valida-ticket.yml` + validador + taxonomia). Aqui solo:
#   1) el disparador de issues,
#   2) los permisos a nivel de job (contents:read, issues:write: lo minimo para leer y para comentar/etiquetar),
#   3) el pin por SHA40 al bundle revisado y fusionado.
#
# El SHA NO se cambia por una rama ni por un tag, y `bundle_sha` tiene que ser el mismo que el `@` de `uses:`:
# el banco de .github lo mide, y un repo que se afloje asi se pone en ROJO.
on:
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  puerta:
    permissions:
      contents: read
      issues: write
    uses: mog-corporation/.github/.github/workflows/valida-ticket.yml@<SHA40_DEL_MERGE>
    with:
      bundle_sha: <SHA40_DEL_MERGE>
