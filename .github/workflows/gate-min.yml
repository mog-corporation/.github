name: gate-min (reutilizable)

# FUENTE UNICA de la puerta minima de un repo de la organizacion.
#
# Un solo job, con nombre FIJO (`gate-min`): ese es el contexto de check que el ruleset de cada repo requiere.
# No se renombra ni se parte en matriz, y corre en `ubuntu-latest` literal (nada de `vars.MOG_RUNS_ON`): el
# contexto tiene que existir siempre y medir lo mismo, tambien cuando el runner self-hosted esta caido.
#
# Que mide:
#   1) banco_salud_min.py (H1-H6) sobre lo versionado del repo, fail-closed (0 VERDE / 1 DEFECTOS / 2 NO_MEDIDO);
#   2) gitleaks pinneado por sha256 sobre el RANGO del PR (`merge-base(base,head)..HEAD`).
# El rango se calcula UNA vez y se pasa a los dos: H4 mide solo ficheros grandes NUEVOS (la deuda previa de un
# repo con imagenes no tumba el PR) y gitleaks mide solo lo que entra. Limite declarado: no se escanea la
# historia completa; un secreto anterior al rango no se reporta aqui.
#
# Sin `permissions`: el caller concede `contents: read` a nivel de job. La puerta no escribe nada.
# Sin `paths`: el check tiene que emitirse en todo PR; un filtro de rutas dejaria PRs sin contexto y el ruleset
# los bloquearia sin causa visible.
on:
  workflow_call:
    inputs:
      bundle_sha:
        description: >
          SHA40 de mog-corporation/.github que el caller fija en `uses:`. Se exige para leer el banco de salud y
          su registro del mismo pin. Una rama o un tag se rechazan: lo que corre es lo revisado.
        required: true
        type: string

jobs:
  gate-min:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exigir pin por SHA40 (fail-closed)
        env:
          BUNDLE_SHA: ${{ inputs.bundle_sha }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          sha = (os.environ.get("BUNDLE_SHA") or "").strip()
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              print("::error::BUNDLE_SHA_NO_ES_SHA40 '%s': el caller debe fijar el SHA del merge del bundle, "
                    "no una rama ni un tag" % sha, file=sys.stderr)
              sys.exit(1)
          print("bundle_sha ok:", sha)
          PY

      # Historia completa: gitleaks necesita el commit base del PR para calcular el rango.
      - name: Checkout del repo bajo medida
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Leer el bundle desde el pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mog-corporation/.github
          ref: ${{ inputs.bundle_sha }}
          path: bundle
          persist-credentials: false

      - name: El bundle trae banco, registro y ensure-gitleaks
        run: |
          set -euo pipefail
          for f in .github/scripts/banco_salud_min.py .github/scripts/gate-min.active.json \
                   .github/actions/ensure-gitleaks/action.yml; do
            test -s "bundle/$f" || { echo "::error::BUNDLE_INCOMPLETO falta bundle/$f"; exit 1; }
          done

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Dependencias del banco
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      # Un solo rango para los dos medidores. En un PR: merge-base(base, head). Fuera de un PR: el ultimo
      # commit (evidencia en main via workflow_dispatch). Si no se puede acotar el rango, no se mide.
      #
      # El base sale del EVENTO (`base.sha`), que viaja en el pago del PR: cero red, cero credenciales. El
      # checkout de arriba ya trae todas las ramas, asi que `origin/<base.ref>` es el segundo recurso sin red.
      # Solo si el objeto del base no esta (PR atrasado o rama base reescrita) se hace UN fetch del sha exacto,
      # autenticado con el token del job: un fetch ciego sin credenciales revienta en repo privado con
      # "fatal: could not read Username for 'https://github.com'" (medido: 5 de 5 callers rojos).
      - name: Acotar el rango revisado
        id: rango
        env:
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENTO" = "pull_request" ]; then
            # 1) base.sha del evento: sin red y sin credenciales.
            # 2) origin/<base.ref>: ya presente por el checkout (fetch-depth 0), tampoco toca la red.
            for cand in "${BASE_SHA:-}" "origin/${BASE_REF:-}"; do
              [ -n "$cand" ] || continue
              git rev-parse -q --verify "${cand}^{commit}" >/dev/null 2>&1 || continue
              if base=$(git merge-base "$cand" HEAD 2>/dev/null); then break; fi
              base=""
            done
            # 3) Ultimo recurso: UN fetch del sha concreto, con credencial. Nada de actualizar refs enteras.
            if [ -z "$base" ] && [ -n "${BASE_SHA:-}" ] && [ -n "${TOKEN:-}" ]; then
              echo "::add-mask::$TOKEN"
              auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
              if git -c "http.extraheader=AUTHORIZATION: basic $auth" \
                   fetch --no-tags origin "$BASE_SHA" >/dev/null 2>&1; then
                base=$(git merge-base "$BASE_SHA" HEAD 2>/dev/null || true)
              fi
            fi
            if [ -z "$base" ]; then
              echo "::error::BASE_NO_MEDIDO sin merge-base con base.sha (${BASE_SHA:-?}) ni origin/${BASE_REF:-?}, y el fetch del sha exacto no lo trajo: no se acota el rango"
              exit 2
            fi
          elif git rev-parse -q --verify HEAD~1 >/dev/null 2>&1; then
            base=$(git rev-parse HEAD~1)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "rango: ${base:-<sin base>}..HEAD"

      - name: Asegurar gitleaks en el runner
        uses: ./bundle/.github/actions/ensure-gitleaks
        with:
          version: "8.30.1"

      # H6 bloquea, no avisa: un `uses:` sin SHA40 pone el job en rojo en este mismo PR.
      - name: Banco de salud minima (H1-H6, fail-closed)
        env:
          BASE: ${{ steps.rango.outputs.base }}
        run: |
          set -euo pipefail
          python3 bundle/.github/scripts/banco_salud_min.py \
            --raiz . \
            --registro bundle/.github/scripts/gate-min.active.json \
            --excluir bundle --excluir .git \
            --base "$BASE"

      # Rango, no historia completa ni arbol entero (el arbol arrastra falsos positivos ya en la base).
      - name: gitleaks sobre el rango revisado
        env:
          BASE: ${{ steps.rango.outputs.base }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ]; then
            echo "gitleaks: rango ${BASE:0:12}..HEAD"
            gitleaks detect --no-banner --redact --exit-code 1 --log-opts="${BASE}..HEAD"
          else
            echo "gitleaks: sin base (primer commit): se escanea el ultimo commit (-1)"
            gitleaks detect --no-banner --redact --exit-code 1 --log-opts="-1"
          fi
